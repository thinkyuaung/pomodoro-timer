<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked during focus</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Not deferred: the saved theme is applied before the page paints (no light→dark flash) -->
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
</head>
<body class="blocked-page">
  <!-- Same decorative pastel scene as index.html (keep the two in sync) -->
  <div class="scene" aria-hidden="true">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="sparkles">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="petals">
      <span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span>
      <span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span>
    </div>
  </div>

  <main class="card blocked-card">
    <svg class="brand-mark blocked-mark" viewBox="-20 -20 40 40" aria-hidden="true" focusable="false">
      <g class="sakura-petals">
        <ellipse rx="6.5" ry="10" cy="-9"/>
        <ellipse rx="6.5" ry="10" cy="-9" transform="rotate(72)"/>
        <ellipse rx="6.5" ry="10" cy="-9" transform="rotate(144)"/>
        <ellipse rx="6.5" ry="10" cy="-9" transform="rotate(216)"/>
        <ellipse rx="6.5" ry="10" cy="-9" transform="rotate(288)"/>
      </g>
      <circle class="sakura-center" r="3.5"/>
    </svg>
    <p class="blocked-ja" lang="ja">集中しよう！</p>
    <h1 class="gradient-text">Stay focused</h1>
    <p>This site is blocked during your focus session.<br>
       It will be available again when the session ends or you pause the timer.</p>
    <!-- <a id="backToTimer" class="btn btn-primary" href="index.html">Back to timer</a> -->
  </main>

  <script defer src="js/blocker.js"></script>
  <script defer src="js/blocked.js"></script>
</body>
</html>
